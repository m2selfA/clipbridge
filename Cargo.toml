[package]
name = "clipbridge"
version = "0.1.0"
edition = "2021"
description = "Lightweight LAN clipboard synchronizer for Windows"
license = "MIT OR Apache-2.0"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dependencies]
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
postcard = { version = "1", features = ["alloc"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
windui = { version = "0.20", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
